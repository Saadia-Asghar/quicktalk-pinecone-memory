<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuickTalk Knowledge Manager</title>
  <style>
    :root{font-family:Inter,Segoe UI,sans-serif;color:#17233b;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}.top{background:#10213a;color:#fff;padding:18px 28px;display:flex;justify-content:space-between}.top a{color:#fff}.wrap{max-width:1250px;margin:22px auto;padding:0 20px}.card{background:#fff;border:1px solid #dce4ee;border-radius:14px;padding:18px;margin-bottom:16px}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:220px}.field label{display:block;font-size:11px;text-transform:uppercase;color:#6b7a90;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cad5e2;border-radius:8px}button{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.primary{background:#5b5ce2;color:white}.danger{background:#fff0f1;color:#a52e3b}.secondary{background:#e9edf5;color:#283750}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}.row{border:1px solid #e3e9f0;border-radius:10px;padding:12px;margin:9px 0}.meta{font-size:11px;color:#718096;margin:5px 0}.badge{font-size:11px;padding:3px 8px;border-radius:20px;background:#e9f8f1;color:#147850}.badge.disabled,.badge.deleted{background:#fff0f1;color:#a52e3b}.actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.empty{color:#718096;padding:20px 0}details summary{cursor:pointer;color:#4f46c8;font-weight:700;margin-top:9px}.transcript{border-top:1px solid #e6ebf2;margin-top:10px;padding-top:8px}.message{padding:9px 11px;border-radius:9px;margin:7px 0;background:#f4f7fb}.message.agent{background:#eeecff}.message b{display:block;font-size:11px;text-transform:uppercase;margin-bottom:3px}.generated{border-left:4px solid #5b5ce2;background:#f7f6ff;padding:10px;margin-top:10px;border-radius:7px}.generated strong{display:block;margin-bottom:5px}@media(max-width:850px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><strong>QuickTalk · Organization Knowledge Manager</strong><nav><a href="/custom">Agent Inbox</a> · <a href="/dashboard">Analytics</a></nav></header>
  <main class="wrap">
    <section class="card toolbar"><div class="field"><label>Organization</label><select id="org"></select></div><button class="primary" id="refresh">Refresh records</button><span class="meta" id="status">Loading…</span></section>
    <section class="card"><h2>Record a completed human-agent chat</h2><div class="toolbar"><div class="field"><label>Customer reference</label><input id="customer" value="demo-customer-001"></div><div class="field"><label>Customer question</label><input id="question" value="Do you provide weekend installation appointments?"></div><div class="field"><label>Human-agent answer</label><input id="answer" value="Weekend installations are available in selected areas and must be confirmed by scheduling."></div><button class="primary" id="complete">Save, close & auto-approve</button></div></section>
    <section class="grid">
      <div class="card"><h2>Human-agent chat records</h2><div id="sessions"></div></div>
      <div class="card"><h2>Active and managed bot knowledge</h2><div class="meta">Edits create a newer automatically active version. Disabled or deleted answers cannot be retrieved.</div><div id="articles"></div></div>
    </section>
  </main>
  <script>
    const API_KEY='quicktalk-local-demo-2026',$=id=>document.getElementById(id),escapeHtml=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const headers=()=>({'Content-Type':'application/json','X-API-Key':API_KEY,'X-Organization-Scope':$('org').value,'X-User-Role':'organization_admin','X-User-ID':'demo-admin'});
    async function api(url,options={}){const r=await fetch(url,{...options,headers:{...headers(),...(options.headers||{})}});const data=await r.json();if(!r.ok)throw new Error(data.detail||data.error||'Request failed');return data}
    async function loadOrganizations(){const r=await fetch('/api/analytics/organizations',{headers:{'X-API-Key':API_KEY}});const data=await r.json();if(!r.ok)throw new Error(data.error||'Cannot load organizations');$('org').innerHTML=data.organizations.map(o=>`<option value="${escapeHtml(o.organization_scope)}">${escapeHtml(o.organization_name)}</option>`).join('');await refresh()}
    async function refresh(){try{$('status').textContent='Refreshing…';const org=encodeURIComponent($('org').value);const [chats,knowledge]=await Promise.all([api(`/api/agent-chats?organization_id=${org}`),api(`/api/knowledge/articles?organization_id=${org}`)]);renderSessions(chats.sessions);renderArticles(knowledge.articles);$('status').textContent=`${chats.sessions.length} chats · ${knowledge.articles.length} knowledge articles`}catch(e){$('status').textContent=e.message}}
    function renderSessions(rows){$('sessions').innerHTML=rows.map(x=>`<div class="row"><strong>${escapeHtml(x.customer_id)}</strong> <span class="badge ${x.status}">${escapeHtml(x.status)}</span><div class="meta">Agent ${escapeHtml(x.agent_id)} · ${x.message_count} messages</div><div class="meta">${escapeHtml(x.closed_at||x.started_at)}</div><details data-session="${escapeHtml(x.id)}"><summary>Expand source chat and generated memory</summary><div class="transcript"><div class="meta">Loading transcript…</div></div></details></div>`).join('')||'<div class="empty">No human-agent chats recorded.</div>';bindTranscripts()}
    function bindTranscripts(){document.querySelectorAll('#sessions details').forEach(details=>details.ontoggle=async()=>{if(!details.open||details.dataset.loaded)return;const box=details.querySelector('.transcript');try{const org=encodeURIComponent($('org').value),session=encodeURIComponent(details.dataset.session);const data=await api(`/api/agent-chats/${session}/messages?organization_id=${org}`);box.innerHTML=data.messages.map(m=>`<div class="message ${m.sender_role}"><b>${escapeHtml(m.sender_role==='agent'?'Human agent':'Customer')}</b>${escapeHtml(m.text)}<div class="meta">${escapeHtml(m.created_at)}</div></div>`).join('')+(data.generated_memory?`<div class="generated"><strong>Generated reusable memory · version ${data.generated_memory.active_version}</strong><div><b>Question:</b> ${escapeHtml(data.generated_memory.canonical_question)}</div><div><b>Approved answer:</b> ${escapeHtml(data.generated_memory.answer)}</div><div class="meta">Status ${escapeHtml(data.generated_memory.status)} · ${escapeHtml(data.generated_memory.approved_by)}</div></div>`:'<div class="generated">No reusable memory was generated from this chat.</div>');details.dataset.loaded='1'}catch(e){box.innerHTML=`<div class="empty">${escapeHtml(e.message)}</div>`}})}
    function renderArticles(rows){$('articles').innerHTML=rows.map(x=>`<div class="row" data-id="${x.id}"><div><span class="badge ${x.status}">${escapeHtml(x.status)}</span> · version ${x.active_version}</div><strong>${escapeHtml(x.canonical_question)}</strong><textarea class="answer" rows="3">${escapeHtml(x.answer)}</textarea><div class="meta">Auto-approved by ${escapeHtml(x.approved_by)}</div><div class="actions"><button class="primary edit">Save new version</button><button class="secondary disable">Disable</button><button class="secondary restore">Restore</button><button class="danger delete">Delete</button></div></div>`).join('')||'<div class="empty">No approved knowledge yet.</div>';bindActions()}
    function bindActions(){document.querySelectorAll('#articles .row').forEach(row=>{const id=row.dataset.id;row.querySelector('.edit').onclick=async()=>{await api(`/api/knowledge/articles/${id}`,{method:'PATCH',body:JSON.stringify({organization_id:$('org').value,answer:row.querySelector('.answer').value})});await refresh()};for(const action of ['disable','restore','delete'])row.querySelector('.'+action).onclick=async()=>{const status=action==='restore'?'active':action==='disable'?'disabled':'deleted';await api(`/api/knowledge/articles/${id}/status`,{method:'POST',body:JSON.stringify({organization_id:$('org').value,status})});await refresh()}})}
    $('complete').onclick=async()=>{try{const org=$('org').value;const session=await api('/api/agent-chats',{method:'POST',body:JSON.stringify({organization_id:org,customer_id:$('customer').value,agent_id:'portal-agent-001'})});for(const [sender_role,text] of [['customer',$('question').value],['agent',$('answer').value]])await api(`/api/agent-chats/${session.id}/messages`,{method:'POST',body:JSON.stringify({organization_id:org,sender_role,text})});await api(`/api/agent-chats/${session.id}/close`,{method:'POST',body:JSON.stringify({organization_id:org})});await refresh()}catch(e){$('status').textContent=e.message}};
    $('refresh').onclick=refresh;$('org').onchange=refresh;loadOrganizations().catch(e=>$('status').textContent=e.message);
  </script>
</body></html>
